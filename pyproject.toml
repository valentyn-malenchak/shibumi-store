[project]
name = "shibumi-store"
version = "0.1.0"
description = "The 'Shibumi Store' backend project is a small e-commerce solution that provides a seamless and efficient shopping experience."
authors = [{ name = "Valentyn Malenchak", email = "valentyn17@gmail.com" }]
requires-python = "==3.12.10"
readme = "README.md"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "pytest==9.0.2",
    "invoke==2.2.1",
    "motor==3.7.1",
    "arrow==1.4.0",
    "httpx==0.28.1",
    "python-multipart==0.0.21",
    "injector==0.23.0",
    "pytest-asyncio==1.3.0",
    "motor-types==1.0.0b4",
    "pytest-cov==7.0.0",
    "pydantic[email]==2.12.5",
    "phonenumbers==9.0.21",
    "pydantic-extra-types==2.11.0",
    "mongodb-migrations==1.3.1",
    "redis==7.1.0",
    "sendgrid==6.12.5",
    "tenacity==9.1.2",
    "pyjwt==2.10.1",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "ruff==0.14.10",
]

[tool.hatch.build.targets.sdist]
include = ["shibumi_store"]

[tool.hatch.build.targets.wheel]
include = ["shibumi_store"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# Ruff configuration
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
# Enable the pycodestyle (`E`), Pyflakes (`F`), pycodestyle warnings (`W`),
# isort (`I`), pep8-naming (`N`), Pylint (`PL`), McCabe complexity (`C901`),.
# pyupgrade (`UP`), Ruff-specific (`RUF`) and FastAPI rules (FAST).
select = ["E", "F", "W", "I", "N", "PL", "C90", "UP", "RUF", "FAST"]
# Allow autofix for isort and F401 imported but unused.
fixable = ["I", "F401", "W292"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


# Mypy configuration
[tool.mypy]
python_version = 3.12
strict = true

[[tool.mypy.overrides]]
module = "mongodb_migrations.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["invoke"]
implicit_reexport = true


# Pytest configuration
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"


# Coverage configuration
[tool.coverage.run]
relative_files = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
  # A pragma comment that excludes a line, branch, fuction or class
  "# pragma: no cover",
  # Skip abstract methods
  "@abstractmethod",
  "@abc.abstractmethod",
  # Skip not implemented methods
  "raise NotImplementedError",
  # Skip module execution blocks
  "if __name__ == \"__main__\":",
]
